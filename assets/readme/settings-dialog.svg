<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">设置对话框示意</title>
  <desc id="sd-desc">设置对话框两个标签页：外观设置（主题/形象/动效/风格/圆角/字体/宽度）和通知设置（停留时间/自动弹卡/拔出提示）。</desc>

  <rect width="900" height="480" rx="18" fill="#0B0F14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="40" font-size="22" font-weight="700" fill="#F0F6FC">设置对话框</text>

    <!-- 外观标签页 -->
    <g transform="translate(40 60)">
      <text x="180" y="0" text-anchor="middle" font-size="16" font-weight="600" fill="#5A8CF0">外观</text>
      <rect width="380" height="380" rx="12" fill="#1C2128" stroke="#30363D" stroke-width="1.5"/>

      <!-- 标签栏 -->
      <rect width="380" height="36" rx="12" fill="#21262D"/>
      <rect x="0" y="24" width="80" height="12" rx="0" fill="#1C2128"/>
      <text x="40" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#5A8CF0">外观</text>
      <text x="140" y="26" text-anchor="middle" font-size="14" fill="#8B949E">通知</text>

      <!-- 表单行 -->
      <g transform="translate(20 52)" fill="#C9D1D9">
        <!-- 悬浮球主题 -->
        <text x="0" y="18" font-size="14" fill="#8B949E">悬浮球主题</text>
        <rect x="120" y="2" width="200" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="22" font-size="14" fill="#F0F6FC">深空蓝</text>
        <text x="300" y="22" font-size="12" fill="#8B949E">&#x25BC;</text>

        <!-- 悬浮球形象 -->
        <text x="0" y="58" font-size="14" fill="#8B949E">悬浮球形象</text>
        <rect x="120" y="42" width="200" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="62" font-size="14" fill="#F0F6FC">小奶龙</text>
        <text x="300" y="62" font-size="12" fill="#8B949E">&#x25BC;</text>

        <!-- 悬浮球动效 -->
        <text x="0" y="98" font-size="14" fill="#8B949E">悬浮球动效</text>
        <rect x="120" y="82" width="200" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="102" font-size="14" fill="#F0F6FC">呼吸</text>
        <text x="300" y="102" font-size="12" fill="#8B949E">&#x25BC;</text>

        <!-- Logo展示时长 -->
        <text x="0" y="138" font-size="14" fill="#8B949E">Logo展示时长</text>
        <rect x="120" y="122" width="170" height="8" rx="4" fill="#30363D"/>
        <rect x="120" y="122" width="90" height="8" rx="4" fill="#5A8CF0"/>
        <circle cx="210" cy="126" r="6" fill="#F0F6FC"/>
        <text x="300" y="134" font-size="13" fill="#8B949E">2.5 秒</text>

        <!-- 卡片主题 -->
        <text x="0" y="170" font-size="14" fill="#8B949E">卡片主题</text>
        <rect x="120" y="154" width="200" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="174" font-size="14" fill="#F0F6FC">深色</text>
        <text x="300" y="174" font-size="12" fill="#8B949E">&#x25BC;</text>

        <!-- 卡片风格 -->
        <text x="0" y="210" font-size="14" fill="#8B949E">卡片风格</text>
        <rect x="120" y="194" width="200" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="214" font-size="14" fill="#F0F6FC">卡片</text>
        <text x="300" y="214" font-size="12" fill="#8B949E">&#x25BC;</text>

        <!-- 卡片圆角 -->
        <text x="0" y="250" font-size="14" fill="#8B949E">卡片圆角</text>
        <rect x="120" y="234" width="170" height="8" rx="4" fill="#30363D"/>
        <rect x="120" y="234" width="85" height="8" rx="4" fill="#5A8CF0"/>
        <circle cx="205" cy="238" r="6" fill="#F0F6FC"/>
        <text x="300" y="246" font-size="13" fill="#8B949E">12 px</text>

        <!-- 字体 -->
        <text x="0" y="282" font-size="14" fill="#8B949E">字体</text>
        <rect x="120" y="266" width="200" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="286" font-size="14" fill="#F0F6FC">跟随系统</text>
        <text x="300" y="286" font-size="12" fill="#8B949E">&#x25BC;</text>

        <!-- 字号 -->
        <text x="0" y="314" font-size="14" fill="#8B949E">字号</text>
        <rect x="120" y="298" width="60" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="318" font-size="14" fill="#F0F6FC">12</text>
        <text x="186" y="318" font-size="12" fill="#8B949E">px</text>

        <!-- 字体颜色 -->
        <text x="0" y="346" font-size="14" fill="#8B949E">字体颜色</text>
        <rect x="120" y="330" width="28" height="18" rx="3" fill="#F0F6FC" stroke="#888" stroke-width="1"/>
        <text x="160" y="344" font-size="13" fill="#5A8CF0">跟随主题</text>

        <!-- 卡片宽度 -->
        <text x="0" y="378" font-size="14" fill="#8B949E">卡片宽度</text>
        <rect x="120" y="362" width="60" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="382" font-size="14" fill="#F0F6FC">320</text>
        <text x="186" y="382" font-size="12" fill="#8B949E">px</text>
      </g>
    </g>

    <!-- 通知标签页 -->
    <g transform="translate(470 60)">
      <text x="180" y="0" text-anchor="middle" font-size="16" font-weight="600" fill="#5A8CF0">通知</text>
      <rect width="380" height="200" rx="12" fill="#1C2128" stroke="#30363D" stroke-width="1.5"/>

      <!-- 标签栏 -->
      <rect width="380" height="36" rx="12" fill="#21262D"/>
      <rect x="0" y="24" width="80" height="12" rx="0" fill="#1C2128"/>
      <text x="40" y="26" text-anchor="middle" font-size="14" fill="#8B949E">外观</text>
      <text x="140" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#5A8CF0">通知</text>

      <g transform="translate(20 52)">
        <!-- 通知停留时间 -->
        <text x="0" y="18" font-size="14" fill="#8B949E">通知停留时间</text>
        <rect x="120" y="2" width="60" height="28" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
        <text x="132" y="22" font-size="14" fill="#F0F6FC">20</text>
        <text x="186" y="22" font-size="12" fill="#8B949E">秒</text>

        <!-- 自动弹卡 -->
        <text x="0" y="62" font-size="14" fill="#8B949E">串口事件时自动弹出卡片</text>
        <rect x="260" y="46" width="36" height="20" rx="10" fill="#238636"/>
        <circle cx="280" cy="56" r="7" fill="#FFFFFF"/>

        <!-- 拔出提示 -->
        <text x="0" y="98" font-size="14" fill="#8B949E">拔出串口时也显示通知</text>
        <rect x="260" y="82" width="36" height="20" rx="10" fill="#238636"/>
        <circle cx="280" cy="92" r="7" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 底部说明 -->
    <text x="40" y="468" font-size="14" fill="#6E7681">所有设置即时生效，无需点击确定/取消。修改立即写入 config.json，下次启动自动加载。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">串口插拔事件流</title>
  <desc id="wf-desc">从 Windows 设备广播到提示卡片更新的五步链路：设备事件、悬浮球捕获、串口刷新、Qt 信号、界面更新。</desc>

  <rect width="1200" height="360" rx="26" fill="#0B0F14"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A8CF0"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="48" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#F0F6FC">串口插拔事件流</text>
  <text x="1152" y="60" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">另有 1s 定时轮询兜底</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 步骤 1 -->
    <g transform="translate(40 96)">
      <rect width="200" height="160" rx="14" fill="#151B23" stroke="#2A3340" stroke-width="1.5"/>
      <text x="16" y="40" font-size="22" font-weight="600" fill="#F0F6FC">Windows 事件</text>
      <text x="16" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">WM_DEVICECHANGE</text>
      <text x="16" y="118" font-size="20" fill="#C9D1D9">USB 插入 / 拔出</text>
    </g>

    <!-- 步骤 2 -->
    <g transform="translate(270 96)">
      <rect width="200" height="160" rx="14" fill="#151B23" stroke="#2A3340" stroke-width="1.5"/>
      <text x="16" y="40" font-size="22" font-weight="600" fill="#F0F6FC">FloatBall</text>
      <text x="16" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">nativeEvent()</text>
      <text x="16" y="118" font-size="20" fill="#C9D1D9">捕获系统广播</text>
    </g>

    <!-- 步骤 3 -->
    <g transform="translate(500 96)">
      <rect width="200" height="160" rx="14" fill="#151B23" stroke="#2A3340" stroke-width="1.5"/>
      <text x="16" y="40" font-size="22" font-weight="600" fill="#F0F6FC">SerialMonitor</text>
      <text x="16" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">schedule_refresh</text>
      <text x="16" y="118" font-size="20" fill="#C9D1D9">200ms 后快照比对</text>
    </g>

    <!-- 步骤 4 -->
    <g transform="translate(730 96)">
      <rect width="200" height="160" rx="14" fill="#151B23" stroke="#2A3340" stroke-width="1.5"/>
      <text x="16" y="40" font-size="22" font-weight="600" fill="#F0F6FC">Qt 信号</text>
      <text x="16" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">port_added</text>
      <text x="16" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">port_removed</text>
    </g>

    <!-- 步骤 5 -->
    <g transform="translate(960 96)">
      <rect width="200" height="160" rx="14" fill="#151B23" stroke="#2A3340" stroke-width="1.5"/>
      <text x="16" y="40" font-size="22" font-weight="600" fill="#F0F6FC">卡片 + 悬浮球</text>
      <text x="16" y="76" font-size="20" fill="#C9D1D9">UI 实时更新</text>
      <text x="16" y="118" font-size="20" fill="#C9D1D9">通知条 · 呼吸闪动</text>
    </g>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#5A8CF0" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="242" y1="176" x2="266" y2="176"/>
    <line x1="472" y1="176" x2="496" y2="176"/>
    <line x1="702" y1="176" x2="726" y2="176"/>
    <line x1="932" y1="176" x2="956" y2="176"/>
  </g>

  <!-- 底部说明 -->
  <text x="48" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8B949E">用户点击卡片「刷新」按钮 → refresh_requested 信号 → 强制重新枚举，修复列表叠影</text>
</svg>

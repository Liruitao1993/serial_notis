<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="cs-title cs-desc">
  <title id="cs-title">卡片窗口状态示意</title>
  <desc id="cs-desc">提示卡片的三种状态：空态、串口列表、带通知条的插拔提示。</desc>

  <rect width="1100" height="520" rx="18" fill="#0B0F14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="40" font-size="22" font-weight="700" fill="#F0F6FC">卡片窗口状态</text>

    <!-- 状态 1：空态 -->
    <g transform="translate(40 60)">
      <text x="140" y="0" text-anchor="middle" font-size="16" font-weight="600" fill="#8B949E">空态</text>
      <rect width="280" height="160" rx="14" fill="#1C2128" stroke="#30363D" stroke-width="1.5"/>
      <!-- 标题栏 -->
      <text x="16" y="32" font-size="16" font-weight="700" fill="#F0F6FC">串口助手</text>
      <text x="210" y="32" font-size="13" fill="#8B949E">0 个串口</text>
      <line x1="16" y1="44" x2="264" y2="44" stroke="#30363D" stroke-width="1"/>
      <!-- 空态提示 -->
      <text x="140" y="100" text-anchor="middle" font-size="15" fill="#6E7681">暂无串口设备</text>
    </g>

    <!-- 状态 2：串口列表 -->
    <g transform="translate(370 60)">
      <text x="160" y="0" text-anchor="middle" font-size="16" font-weight="600" fill="#8B949E">串口列表</text>
      <rect width="320" height="280" rx="14" fill="#1C2128" stroke="#30363D" stroke-width="1.5"/>
      <!-- 标题栏 -->
      <text x="16" y="32" font-size="16" font-weight="700" fill="#F0F6FC">串口助手</text>
      <text x="246" y="32" font-size="13" fill="#8B949E">3 个串口</text>
      <line x1="16" y1="44" x2="304" y2="44" stroke="#30363D" stroke-width="1"/>

      <!-- COM3 行（选中态） -->
      <rect x="12" y="54" width="296" height="46" rx="8" fill="rgba(100,170,255,0.12)" stroke="rgba(130,200,255,0.4)" stroke-width="1.5"/>
      <text x="28" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F0F6FC">COM3</text>
      <text x="280" y="83" font-size="14" fill="#C9D1D9">主节点</text>

      <!-- COM7 行 -->
      <rect x="12" y="108" width="296" height="46" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>
      <text x="28" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F0F6FC">COM7</text>
      <text x="280" y="137" font-size="14" fill="#C9D1D9">调试口</text>

      <!-- COM27 行 -->
      <rect x="12" y="162" width="296" height="46" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>
      <text x="28" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F0F6FC">COM27</text>
      <text x="280" y="191" font-size="14" fill="#C9D1D9">传感器</text>

      <!-- Tooltip 示意 -->
      <rect x="28" y="218" width="240" height="44" rx="6" fill="#2D333B" stroke="#444C56" stroke-width="1"/>
      <text x="40" y="236" font-size="12" fill="#8B949E">VID:PID 1A86:7523</text>
      <text x="40" y="254" font-size="12" fill="#8B949E">制造商: QinHeng Electronics</text>
    </g>

    <!-- 状态 3：带通知条 -->
    <g transform="translate(730 60)">
      <text x="180" y="0" text-anchor="middle" font-size="16" font-weight="600" fill="#8B949E">插拔通知</text>
      <rect width="360" height="340" rx="14" fill="#1C2128" stroke="#30363D" stroke-width="1.5"/>
      <!-- 标题栏 -->
      <text x="16" y="32" font-size="16" font-weight="700" fill="#F0F6FC">串口助手</text>
      <text x="284" y="32" font-size="13" fill="#8B949E">2 个串口</text>
      <line x1="16" y1="44" x2="344" y2="44" stroke="#30363D" stroke-width="1"/>

      <!-- 插入通知条（绿色） -->
      <rect x="12" y="54" width="336" height="48" rx="10" fill="rgba(120,220,140,0.15)" stroke="rgba(120,220,140,0.5)" stroke-width="1.5"/>
      <text x="28" y="84" font-size="18">&#x2795;</text>
      <text x="52" y="84" font-size="14" fill="#7EE787">新增串口：COM27（传感器）</text>

      <!-- 拔出通知条（红色） -->
      <rect x="12" y="110" width="336" height="48" rx="10" fill="rgba(230,80,80,0.15)" stroke="rgba(230,80,80,0.5)" stroke-width="1.5"/>
      <text x="28" y="140" font-size="18">&#x2716;</text>
      <text x="52" y="140" font-size="14" fill="#FFA0A0">已拔出：COM7（调试口）</text>

      <line x1="16" y1="170" x2="344" y2="170" stroke="#30363D" stroke-width="1"/>

      <!-- 串口行 -->
      <rect x="12" y="180" width="336" height="42" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>
      <text x="28" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F0F6FC">COM3</text>
      <text x="310" y="207" font-size="14" fill="#C9D1D9">主节点</text>

      <rect x="12" y="230" width="336" height="42" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>
      <text x="28" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F0F6FC">COM27</text>
      <text x="310" y="257" font-size="14" fill="#C9D1D9">传感器</text>

      <!-- 历史记录按钮 -->
      <text x="308" y="316" font-size="16" fill="#8B949E">&#x1F550;</text>
      <text x="16" y="316" font-size="12" fill="#6E7681">点击查看插拔事件记录</text>
    </g>

    <!-- 底部说明 -->
    <text x="40" y="440" font-size="15" fill="#8B949E">卡片支持：透明度滑条调节 · 自动弹出/收回 · 备注名编辑 · 串口行选中高亮 · 插拔事件历史（最多 10 条）</text>
    <text x="40" y="468" font-size="15" fill="#8B949E">三种卡片风格：卡片（直角~圆角）· 气泡（渐变高圆角）· 极简（低边框）· 圆角 0~24px · 宽度 240~480px</text>
    <text x="40" y="496" font-size="15" fill="#8B949E">USB 3D 弹框：插拔时屏幕居中显示大图标动画（QPainter 绘制），时长 0.5~5 秒可调</text>
  </g>
</svg>

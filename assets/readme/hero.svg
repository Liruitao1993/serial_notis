<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">串口提示助手 — USB 串口插拔即时提示</title>
  <desc id="hero-desc">深色背景，左侧为项目名与价值说明，右侧为悬浮球与提示卡片的界面示意。</desc>

  <rect width="1200" height="420" rx="26" fill="#0B0F14"/>

  <!-- 悬浮球光晕：右侧主视觉的背景柔光 -->
  <circle cx="1128" cy="312" r="150" fill="#5A8CF0" opacity="0.08"/>

  <!-- 左侧：标题区 -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="4" fill="#8B949E">WINDOWS · 串口监控工具</text>
    <text x="54" y="160" font-size="76" font-weight="700" fill="#F0F6FC">串口提示助手</text>
    <text x="56" y="222" font-size="40" font-weight="600" fill="#5A8CF0">USB 串口插拔，即时可见</text>
    <text x="56" y="272" font-size="24" fill="#C9D1D9">插拔瞬间自动弹出提示卡片：插入绿色，拔出红色</text>
    <text x="56" y="306" font-size="24" fill="#C9D1D9">悬浮球常驻桌面显示串口数量，点击即开即关</text>
    <text x="56" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B949E">PySide6 ≥6.6 · pyserial ≥3.5 · Python 3.13</text>
  </g>

  <!-- 右侧：界面示意（提示卡片 + 悬浮球） -->
  <g id="ui-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="736" y="64" width="368" height="276" rx="18" fill="#151B23" stroke="#2A3340" stroke-width="1.5"/>

    <!-- 插入通知条 -->
    <rect x="756" y="84" width="328" height="50" rx="10" fill="#12261B" stroke="#2EA043" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="776" cy="109" r="6" fill="#3FB950"/>
    <text x="794" y="116" font-size="22" fill="#7EE787">已插入</text>
    <text x="878" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#7EE787">COM27</text>

    <!-- 列表标题 -->
    <text x="756" y="172" font-size="24" font-weight="600" fill="#F0F6FC">串口列表</text>
    <text x="884" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B949E">2 个设备</text>

    <!-- COM27 行（选中态） -->
    <rect x="756" y="188" width="328" height="54" rx="10" fill="#1F6FEB" fill-opacity="0.18" stroke="#1F6FEB" stroke-width="1.5"/>
    <text x="776" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#F0F6FC">COM27</text>
    <text x="1048" y="223" text-anchor="end" font-size="22" fill="#C9D1D9">主节点</text>

    <!-- COM64 行 -->
    <rect x="756" y="252" width="328" height="54" rx="10" fill="none" stroke="#2A3340" stroke-width="1.5"/>
    <text x="776" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#F0F6FC">COM64</text>
    <text x="1048" y="287" text-anchor="end" font-size="22" fill="#C9D1D9">从节点</text>

    <!-- 悬浮球（核心母题：蓝色计数球） -->
    <circle cx="1128" cy="312" r="62" fill="#5A8CF0"/>
    <text x="1128" y="340" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">3</text>
    <text x="1128" y="404" text-anchor="middle" font-size="16" fill="#8B949E">串口数</text>
  </g>
</svg>
